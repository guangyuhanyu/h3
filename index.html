<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>汉语课堂 · Guangyu Hanyu · HSK3 3.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@1,600;1,700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F2EC; --paper-2:#E6E8EC; --card:#FCFBF8;
  --orange:#50668C; --orange-d:#2C3E60; --orange-soft:#EDF1F7; --orange-line:#A3BBDB;
  --gold:#C86A3E; --gold-soft:#FDF0E6; --seal:#B0281E; --blue:#3B78AE;
  --ink:#1A243A; --gray:#7E889C; --line:#D6D9E0; --ok:#3E8E5A;
  --f-disp:'Baloo 2','Inter',system-ui,sans-serif;
  --f-body:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-han:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  --f-title:'Noto Serif SC','Songti SC','SimSun',serif;
  --shadow:0 10px 30px rgba(44,62,96,.10);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;
  background-image:radial-gradient(900px 500px at 100% -5%,#E3EAF4 0%,transparent 60%),radial-gradient(700px 420px at -10% 30%,#EEEDE6 0%,transparent 60%);
  padding:20px 16px 60px;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
.app{max-width:1080px;margin:0 auto}
.han{font-family:var(--f-han)}

/* Banner */
.d-corner{right:-28px;top:-30px;width:260px;opacity:.9}
.d-cloud{left:-24px;bottom:-14px;width:240px;opacity:.45}
.d-hang{right:270px;top:-8px;height:140px;opacity:.85}
.d-wave{right:-60px;bottom:-80px;width:230px;opacity:.16}
.d-stamp{right:140px;bottom:14px;width:96px;opacity:.15;transform:rotate(-12deg)}
.brand{display:flex;align-items:center;gap:16px}
.brand img{width:84px;height:84px;object-fit:contain;filter:drop-shadow(0 3px 6px rgba(150,40,30,.18))}
.brand b{display:block;font-family:var(--f-disp);font-size:26px;line-height:1.15;color:var(--seal)}
.brand span{font-size:15px;color:var(--gray)}
.lesson{margin-top:18px;display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap}
.lesson .k{font-family:var(--f-title);font-weight:700;font-size:21px;line-height:1.2}
.lesson h1{margin:6px 0 0;font-family:var(--f-title);font-weight:900;font-size:56px;line-height:1.05;color:var(--orange-d)}
.seal{width:66px;height:66px;border-radius:10px;background:var(--seal);color:#fff;font-family:var(--f-title);font-weight:900;font-size:22px;line-height:1.05;display:grid;place-items:center;text-align:center;transform:rotate(-6deg);box-shadow:inset 0 0 0 3px rgba(255,255,255,.35);margin-left:auto}
.tagline{margin:16px 0 0;gap:12px!important;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.zalo{display:inline-flex;align-items:center;gap:6px;background:#EADBC2;color:var(--ink);border:1px solid #DCC8A6;text-decoration:none;font-weight:700;border-radius:99px;padding:5px 14px 5px 10px;font-size:15px}
.zalo:hover{background:#E2CFB0}
.tl{font-family:var(--f-title);font-weight:700;font-size:20px;color:var(--orange-d)}

/* Layout */
.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:22px;margin-top:22px;align-items:start}
.sidebar{display:flex;flex-direction:column;gap:12px;position:sticky;top:16px}
.cat-btn{display:flex;align-items:center;gap:14px;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:14px 16px;text-align:left;box-shadow:0 4px 14px rgba(44,62,96,.06);transition:.15s;width:100%}
.cat-btn:hover{border-color:var(--orange-line);transform:translateY(-1px)}
.cat-btn.active{border-color:var(--orange);background:#fff;box-shadow:0 0 0 4px var(--orange-soft),var(--shadow)}
.cat-ico{flex:none;width:48px;height:48px;border-radius:10px;color:#F6EBD9;background-image:linear-gradient(160deg,rgba(255,255,255,.08),rgba(0,0,0,.12));font-family:var(--f-title);font-weight:900;font-size:24px;display:grid;place-items:center;transform:rotate(-4deg);box-shadow:inset 0 0 0 2px rgba(246,235,217,.45),inset 0 0 0 4px rgba(0,0,0,.08)}
.cat-txt{flex:1;min-width:0}
.cat-txt b{display:block;font-family:var(--f-disp);font-size:19px;line-height:1.2}
.cat-txt small{display:block;font-size:13.5px;color:var(--gray);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-n{flex:none;font-family:var(--f-disp);font-weight:700;font-size:15px;color:var(--orange-d);background:var(--orange-soft);border-radius:99px;min-width:34px;text-align:center;padding:2px 10px}

.main{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:22px 22px 26px;min-height:420px}
.back-btn{display:none;align-items:center;gap:6px;border:1.5px solid var(--line);background:#fff;color:var(--orange-d);border-radius:99px;padding:8px 16px 8px 10px;font-weight:700;font-size:15px;margin-bottom:14px}
.back-btn svg{width:18px;height:18px}
.list-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.list-head .cat-ico{width:52px;height:52px;font-size:26px}
.list-head h2{margin:0;font-family:var(--f-disp);font-size:26px;line-height:1.15}
.list-head h2 small{display:block;font-family:var(--f-body);font-size:15px;font-weight:500;color:var(--gray)}
.search{position:relative;margin-top:16px}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--orange)}
.search input{width:100%;font:inherit;font-size:17px;padding:13px 16px 13px 46px;border:2px solid var(--line);border-radius:14px;background:var(--paper)}
.search input:focus{outline:none;border-color:var(--orange);background:#fff;box-shadow:0 0 0 4px var(--orange-soft)}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:18px}
.card{display:flex;align-items:center;gap:14px;text-decoration:none;background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:14px 16px;transition:.15s;position:relative}
.card:hover{border-color:var(--orange);transform:translateY(-2px);box-shadow:0 10px 22px rgba(44,62,96,.14)}
.num{flex:none;width:56px;height:56px;border-radius:14px;background:var(--orange-soft);color:var(--orange-d);display:grid;place-items:center;text-align:center;line-height:1}
.num b{font-family:var(--f-disp);font-size:24px;font-weight:800;display:block}
.num small{font-family:var(--f-han);font-size:11px;font-weight:700;display:block;margin-top:2px}
.card-body{flex:1;min-width:0}
.card-t{font-family:var(--f-han);font-size:21px;font-weight:500;line-height:1.3;color:var(--ink)}
.card-v{font-weight:700;font-size:15px;color:var(--orange-d)}
.card-d{font-size:14px;color:var(--gray);line-height:1.45;margin-top:2px}
.arrow{flex:none;width:36px;height:36px;border-radius:50%;background:var(--paper);display:grid;place-items:center;color:var(--orange-d);transition:.15s}
.card:hover .arrow{background:var(--orange);color:#fff}
.arrow svg{width:18px;height:18px}
.tag{display:inline-block;font-size:11.5px;font-weight:700;border-radius:6px;padding:1px 7px;margin-left:6px;vertical-align:2px;background:var(--gold-soft);color:#8A6418}
.empty{text-align:center;padding:50px 10px;color:var(--gray)}
.empty .h{font-family:var(--f-title);font-size:30px;color:var(--orange-d)}

.share{text-align:center;margin-top:26px}
.share button{border:0;border-radius:99px;font-family:var(--f-disp);font-weight:700;font-size:18px;padding:12px 30px;background:linear-gradient(135deg,var(--orange),var(--orange-d));color:#fff;box-shadow:0 10px 22px rgba(44,62,96,.28)}
.share button.done{background:var(--ok)}
.foot{text-align:center;color:var(--gray);font-size:14px;margin-top:22px}
.foot b{font-family:var(--f-disp);color:var(--ink);font-size:15px}

@media (max-width:860px){.grid{grid-template-columns:1fr}.layout{grid-template-columns:260px minmax(0,1fr)}}
@media (max-width:760px){
  body{padding:12px 12px 50px}
  .banner{padding:20px 18px 18px;border-radius:22px}
  .d-corner{width:170px;right:-30px;top:-26px;opacity:.6}.d-hang{display:none}.d-cloud{width:170px;opacity:.3}.d-stamp{width:62px;right:84px;bottom:8px;opacity:.12}
  .lesson h1{font-size:40px}.seal{width:52px;height:52px;font-size:18px}
  .brand img{width:64px;height:64px}.brand b{font-size:22px}
  .layout{display:block}
  .sidebar{position:static}
  .main{display:none;padding:16px 14px 20px;border-radius:20px}
  .back-btn{display:inline-flex}
  .app.view-list .sidebar{display:none}
  .app.view-list .main{display:block}
  .card-t{font-size:19px}
  .num{width:50px;height:50px}.num b{font-size:21px}
}

.member{margin-top:16px;background:var(--card);border:1.5px solid #DCC8A6;border-radius:18px;padding:12px 16px;display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap;box-shadow:0 4px 14px rgba(44,62,96,.06);font-size:15.5px}
.member .m-lock,.member .m-ok{font-size:22px}
.member .m-txt{flex:1 1 280px}
.m-form{display:flex;gap:8px;flex:1 1 260px;min-width:0;max-width:100%}
.m-form input{flex:1;min-width:0;font:inherit;font-size:17px;letter-spacing:.06em;text-transform:uppercase;padding:9px 14px;border:2px solid var(--line);border-radius:12px;background:var(--paper)}
.m-form input:focus{outline:none;border-color:var(--orange);background:#fff;box-shadow:0 0 0 4px var(--orange-soft)}
.m-form button{border:0;border-radius:12px;background:#9B2D24;color:#F6EBD9;font-weight:700;font-size:16px;padding:0 18px;white-space:nowrap}
.m-form button[disabled]{opacity:.6}
.m-link{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:5px 14px;color:var(--orange-d);font-weight:700;font-size:14px}
.m-msg{flex-basis:100%;color:#C23B2E;font-weight:600;font-size:14.5px}
.m-msg:empty{display:none}
.card.locked{background:#F8F2EA;border-style:dashed}
.card.locked .card-t,.card.locked .card-v{opacity:.55}
.card.locked .num{background:#EDE3D5;color:#9C8B7C}
.card.locked .arrow{background:#EDE3D5;color:#8A6A33}
.card.locked:hover{border-color:#C9A04E;box-shadow:none;transform:none}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);opacity:0;pointer-events:none;background:#2E2420;color:#fff;border-radius:14px;padding:12px 18px;font-size:15px;max-width:min(92vw,520px);text-align:center;transition:.25s;z-index:99}
.toast.show{opacity:1;transform:translate(-50%,0)}



.cat-ico{border-radius:50%;transform:none;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.35),rgba(255,255,255,0) 45%),var(--c,#4E8A7E);color:#FFFCF5;
 box-shadow:0 0 0 3px var(--card),0 0 0 4.5px var(--orange-line),0 4px 10px rgba(44,62,96,.22);position:relative}
.cat-ico::after{content:"";position:absolute;right:-3px;top:-3px;width:11px;height:11px;border-radius:3px;background:var(--seal);transform:rotate(12deg);box-shadow:0 0 0 2px var(--card)}
.num{border-radius:50%;background:var(--orange-soft);box-shadow:inset 0 0 0 1.5px var(--orange-line)}
.card.soon{background:#F5F7FA;border-style:dashed;cursor:default}.card.soon:hover{transform:none;box-shadow:none;border-color:var(--line)}
.card.soon .arrow{background:var(--paper-2);color:var(--gray)}.card.soon .card-t,.card.soon .num{opacity:.6}
.tag.soon{background:var(--paper-2);color:var(--gray)}
.sub-h{grid-column:1/-1;margin:8px 0 -4px;font-weight:700;color:var(--orange-d);font-size:15px;display:flex;align-items:center;gap:10px}.sub-h::after{content:"";flex:1;height:1px;background:var(--line)}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);opacity:0;pointer-events:none;background:#25302D;color:#fff;border-radius:14px;padding:12px 18px;font-size:15px;max-width:min(92vw,520px);text-align:center;transition:.25s;z-index:99}.toast.show{opacity:1;transform:translate(-50%,0)}
.member{margin-top:16px;background:var(--card);border:1.5px solid var(--orange-line);border-radius:18px;padding:12px 16px;display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap;box-shadow:0 4px 14px rgba(44,62,96,.06);font-size:15.5px}
.member .m-lock,.member .m-ok{font-size:22px}
.member .m-txt{flex:1 1 280px}
.m-form{display:flex;gap:8px;flex:1 1 260px;min-width:0;max-width:100%}
.m-form input{flex:1;min-width:0;font:inherit;font-size:17px;letter-spacing:.08em;padding:9px 14px;border:2px solid var(--line);border-radius:12px;background:var(--paper)}
.m-form input:focus{outline:none;border-color:var(--orange);background:#fff;box-shadow:0 0 0 4px var(--orange-soft)}
.m-form button{border:0;border-radius:12px;background:var(--orange-d);color:#F3F6FA;font-weight:700;font-size:16px;padding:0 18px;white-space:nowrap;cursor:pointer}
.m-form button[disabled]{opacity:.6}
.m-link{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:5px 14px;color:var(--orange-d);font-weight:700;font-size:14px;cursor:pointer}
.m-msg{flex-basis:100%;color:var(--seal);font-weight:600;font-size:14.5px}
.m-msg:empty{display:none}
.card.locked{background:#F3F5F9;border-style:dashed}
.card.locked .card-t,.card.locked .card-v{opacity:.55}
.card.locked .num{background:#E4E8EF;color:#8B958F;box-shadow:none}
.card.locked .arrow{background:#E4E8EF;color:var(--gray)}
.card.locked:hover{border-color:var(--orange-line);box-shadow:none;transform:none}

function renderMember(){
  const s=GY.session(),raw=GY.rawSession(),el=document.querySelector('#member');
  if(s){el.innerHTML=`<span class="m-ok">🔓</span><span class="m-txt">Xin chào <b>${s.name||'bạn'}</b> · đã mở <b>${(s.lessons||[]).length}</b>/18 bài · hạn dùng đến <b>${GY.fmtDate(s.exp)}</b></span><button type="button" id="mOut" class="m-link">Đổi mã</button>`;
    document.querySelector('#mOut').onclick=()=>{GY.logout();unlockLinks().then(()=>{renderMember();renderAll()})};return}
  el.innerHTML=`<span class="m-lock">🔒</span><span class="m-txt">${raw&&new Date(raw.exp)<new Date()?'<b style="color:var(--seal)">Mã đã hết hạn.</b> ':''}Bài 1 học thử miễn phí. Nhập <b>mã học viên</b> để mở các bài khác:</span>
   <span class="m-form"><input id="mCode" placeholder="XXXXXXXX" inputmode="numeric" autocomplete="off" spellcheck="false"><button type="button" id="mGo">Mở khóa</button></span><span class="m-msg" id="mMsg"></span>`;
  const go=async()=>{const b=document.querySelector('#mGo');b.disabled=true;b.textContent='Đang kiểm tra…';const r=await GY.login(document.querySelector('#mCode').value);b.disabled=false;b.textContent='Mở khóa';
    if(!r.ok){document.querySelector('#mMsg').textContent=GY.ERR[r.error]||'Có lỗi, thử lại sau.';return}await unlockLinks();renderMember();renderAll()};
  document.querySelector('#mGo').onclick=go;document.querySelector('#mCode').onkeydown=e=>{if(e.key==='Enter')go()};
}
function lockedMsg(){const t=document.querySelector('#toast');t.textContent='🔒 Mục này chưa được mở. Nhập mã học viên ở trên, hoặc liên hệ Thầy Vy để mở thêm bài.';t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),3200);
  const c=document.querySelector('#mCode');if(c){c.scrollIntoView({behavior:'smooth',block:'center'});setTimeout(()=>c.focus({preventScroll:true}),400)}}

const $=s=>document.querySelector(s);

function renderSidebar(){
 $('#sidebar').innerHTML=CATEGORIES.map((c,i)=>`<button type="button" class="cat-btn ${state.category===c.id?'active':''}" data-id="${c.id}">
  <span class="cat-ico gy i${i}" style="--n:${c.color}"><img src="${ICO[i]}" alt=""><b>${i+1}</b></span><span class="cat-txt"><b>${c.label}</b><small>${c.sub}</small></span><span class="cat-n">${cnt(c.id)}</span></button>`).join('');
 document.querySelectorAll('.cat-btn').forEach(b=>b.addEventListener('click',()=>{state.category=b.dataset.id;state.view='list';state.search='';$('#searchInput').value='';renderAll();if(innerWidth<=760)scrollTo({top:0})}));
}
function renderHead(){const i=CATEGORIES.findIndex(c=>c.id===state.category),c=CATEGORIES[i];
 $('#listHead').innerHTML=`<span class="cat-ico gy i${i}" style="--n:${c.color}"><img src="${ICO[i]}" alt=""><b>${i+1}</b></span><h2>${c.label}<small>${c.sub}</small></h2>`}
const ARROW='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
const CLOCK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>';
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(e._h);e._h=setTimeout(()=>e.classList.remove('show'),3000)}
function renderResults(){
 const q=state.search.trim().toLowerCase();
 const items=LESSONS.filter(l=>l.category===state.category&&(!q||(l.titleVi+' '+l.hanzi+' '+l.desc).toLowerCase().includes(q)));
 if(!items.length){$('#results').innerHTML='<div class="empty"><div class="h">尚无课件</div>Thầy sẽ cập nhật sớm, quay lại sau nhé.</div>';return}
 let last='';
 $('#results').innerHTML='<div class="grid">'+items.map((l,k)=>{
  const u=UNIT_OF(l),locked=!!(u&&!GY.key(u));const ext=/^https?:/.test(l.href)||!!l.enc;let head='';
  if(l.group&&l.group!==last){head=`<div class="sub-h">${l.group}</div>`;last=l.group}
  const num=l.n?`<b>${l.n}</b><small>第${l.n}课</small>`:`<b class="zh">${l.ico||'复'}</b>`;
  return head+`<a class="card ${locked?'locked':''} ${l.soon?'soon':''}" ${l.soon?'data-soon="1"':''} href="${locked||!l.href?'#':l.href}" ${locked?'data-locked="1"':''} ${ext&&!locked?'target="_blank" rel="noopener"':''}>
   <span class="num">${num}</span><span class="card-body"><span class="card-v">${l.titleVi}${ext?'<span class="tag">Drive</span>':''}${l.soon?'<span class="tag soon">Sắp có</span>':''}</span>
   ${l.hanzi?`<span class="card-t" style="display:block">${l.hanzi}</span>`:''}<span class="card-d" style="display:block">${l.desc}</span></span>
   <span class="arrow">${locked?LOCK:ARROW}</span></a>`}).join('')+'</div>';
 document.querySelectorAll('.card[data-locked]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();lockedMsg()}));
 document.querySelectorAll('.card[data-soon]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();toast('Thầy đang hoàn thiện đề này, quay lại sau nhé!')}));
}
function renderAll(){renderSidebar();renderHead();renderResults();app.classList.toggle('view-list',state.view==='list')}
$('#backBtn').addEventListener('click',()=>{state.view='menu';app.classList.remove('view-list');scrollTo({top:0})});
$('#searchInput').addEventListener('input',e=>{state.search=e.target.value;renderResults()});
renderMember();renderAll();
const syncNow=async()=>{if(GY.rawSession()){await GY.refresh(false);}await unlockLinks();renderMember();renderAll()};
syncNow();
window.addEventListener('pageshow',e=>{if(e.persisted)syncNow()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncNow()});
</script></body></html>
